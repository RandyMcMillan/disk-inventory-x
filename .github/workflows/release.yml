name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(xcodebuild -workspace workspace.xcworkspace -scheme "Disk Inventory X" -configuration Release -showBuildSettings 2>/dev/null | awk '/MARKETING_VERSION/{print $3}')
          echo "Tag version: $TAG_VERSION"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Version mismatch: tag $TAG_VERSION does not match project $PROJECT_VERSION"
            exit 1
          fi

      - name: Build Release
        run: ./BuildRelease.sh

      - name: Package app
        run: |
          ditto -c -k --keepParent "build/Release/Disk Inventory X.app" "Disk-Inventory-X-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Disk Inventory X ${GITHUB_REF_NAME}" \
            --generate-notes \
            "Disk-Inventory-X-${GITHUB_REF_NAME}.zip"
